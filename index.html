<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bulk Reply</title>
  <style>
    :root { font-family: Inter, Arial, sans-serif; color: #172033; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    main { width: min(920px, 100%); margin: 0 auto; padding: 28px 18px 48px; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .sub { margin: 0 0 22px; color: #667085; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: white; border: 1px solid #e4e7ec; border-radius: 14px; padding: 18px; box-shadow: 0 4px 18px #1720330d; }
    label { display: block; margin: 0 0 7px; font-weight: 700; font-size: 14px; }
    textarea, input, select { width: 100%; border: 1px solid #cfd5df; border-radius: 9px; padding: 11px; font: inherit; }
    textarea { min-height: 150px; resize: vertical; }
    #message { min-height: 390px; font-family: Consolas, monospace; font-size: 13px; }
    .hint { margin: 7px 0 0; color: #667085; font-size: 12px; }
    .actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
    button { border: 0; border-radius: 9px; padding: 11px 18px; color: white; background: #1769e0; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { font-size: 14px; }
    .preview { min-height: 390px; overflow: auto; border: 1px solid #e4e7ec; border-radius: 9px; padding: 14px; }
    .preview-tools { display: flex; gap: 6px; margin: 10px 0; }
    .preview-tools button { padding: 7px 10px; color: #344054; background: #eef2f7; font-size: 12px; }
    .preview-tools button.active { color: white; background: #1769e0; }
    .preview-frame { display: flex; justify-content: center; background: #f5f7fb; padding: 10px; border-radius: 9px; }
    .preview-frame .preview { width: 100%; min-height: 390px; background: white; }
    .preview-frame.mobile .preview { width: 390px; }
    .preview-frame.tablet .preview { width: 768px; }
    .preview-frame.desktop .preview { width: 100%; }
    .product-group { margin-top: 14px; padding: 12px; border: 1px solid #e4e7ec; border-radius: 9px; background: #fafbfc; }
    .product-group-title { margin-bottom: 8px; font-weight: 700; }
    .product-row { display: grid; grid-template-columns: 1.25fr 1.5fr .65fr 2.5fr auto; gap: 6px; margin-top: 6px; }
    .product-row input { min-width: 0; padding: 8px; font-size: 12px; }
    .product-row button { padding: 7px 9px; background: #d92d20; }
    .product-editor-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    @media (max-width: 700px) { .product-row { grid-template-columns: 1fr 1fr; } .product-row input:nth-child(4) { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <main>
    <h1>Bulk Reply</h1>
    <p class="sub">Pilih email, masukkan pesan, lalu klik Apply.</p>

    <section class="grid">
      <div class="card">
        <label for="emails">Email target</label>
        <textarea id="emails" placeholder="one@email.com\ntwo@email.com"></textarea>
        <p class="hint">Satu alamat email per baris. Website otomatis membagi setiap 50 email per batch.</p>

        <label for="endpoint" style="margin-top:18px">Power Automate endpoint</label>
        <input id="endpoint" type="url" placeholder="Tempel URL trigger HTTP di sini">
        <p class="hint">URL ini hanya dipakai saat tombol Apply ditekan.</p>

        <div class="actions">
          <button id="apply" type="button">Apply</button>
          <span id="status" role="status"></span>
        </div>
      </div>

      <div class="card">
        <label for="template">Template pesan</label>
        <select id="template">
          <option value="campaign">Template 1 — Campaign lengkap</option>
          <option value="short">Template 2 — Pesan singkat</option>
          <option value="latest">Template 3 — Product list terbaru</option>
        </select>
        <button id="loadTemplate" type="button" style="margin-top:10px">Gunakan template</button>

        <label style="margin-top:18px">Edit product list (Template 3)</label>
        <div id="productRows"></div>
        <div class="product-editor-actions">
          <button id="addProduct" type="button">+ Add product</button>
          <button id="updateProducts" type="button">Update product list</button>
        </div>
        <p class="hint">Edit kolomnya langsung. Perubahan tersimpan di browser ini.</p>

        <label for="message">Pesan HTML</label>
        <textarea id="message" placeholder="Paste HTML email di sini"></textarea>
        <p class="hint">Cek tampilan pesan sebelum dikirim.</p>
        <div class="preview-tools" aria-label="Ukuran preview">
          <button type="button" data-device="mobile" class="active">Mobile</button>
          <button type="button" data-device="tablet">Tablet</button>
          <button type="button" data-device="desktop">Desktop</button>
        </div>
        <div id="previewFrame" class="preview-frame mobile"><div id="preview" class="preview"></div></div>
      </div>
    </section>
  </main>

  <script>
    const emails = document.querySelector('#emails');
    const endpoint = document.querySelector('#endpoint');
    const message = document.querySelector('#message');
    const template = document.querySelector('#template');
    const loadTemplate = document.querySelector('#loadTemplate');
    const productRows = document.querySelector('#productRows');
    const addProduct = document.querySelector('#addProduct');
    const updateProducts = document.querySelector('#updateProducts');
    const preview = document.querySelector('#preview');
    const previewFrame = document.querySelector('#previewFrame');
    const apply = document.querySelector('#apply');
    const status = document.querySelector('#status');

    const latestProductGroups = [
      {
        title: 'Pick Product link TOP Promotion &amp; Hot Selling (Based on TIKTOK Data):',
        products: [
          ['Laura Geller Beauty', 'TOP 1 Cosmetics category', '19%', 'https://affiliate-us.tiktok.com/api/v1/share/AJR1ZpsOL2Tx'],
          ['Missha.official', 'Top 2 Cosmetics Category', '16%', 'https://affiliate-us.tiktok.com/api/v1/share/AJr730r5qXKT'],
          ['epais', 'TOP 3 selling', '17%', 'https://affiliate-us.tiktok.com/api/v1/share/AJm3Z1gBIGtc'],
          ['DR.Melaxin eye cream', 'TOP 4', '24%', 'https://affiliate-us.tiktok.com/api/v1/share/AJgq5DuwThqi'],
          ['DR.Melaxin acne patch', '', '24%', 'https://affiliate-us.tiktok.com/api/v1/share/AJgq5ObngzDG']
        ]
      },
      {
        title: 'ALL BRAND High Commission:',
        products: [
          ['Medicube', 'All product link', '19%', 'https://affiliate-us.tiktok.com/api/v1/share/AJoWb7mq7Igr'],
          ['COSRX', 'All product link', '29%', 'https://affiliate-us.tiktok.com/api/v1/share/AJoWk2StXIJ3'],
          ['SKIN1004', 'All product link', '24%', 'https://affiliate-us.tiktok.com/api/v1/share/AJoX6yXB3o1X']
        ]
      }
    ];

    let latestProductHtml = latestProductGroups.map(group => `<p><strong>${group.title}</strong></p>
<ul>${group.products.map(([name, label, commission, url]) => `<li><strong>${name}</strong>${label ? ` — ${label}` : ''}: <a href="${url}">${url}</a> (${commission})</li>`).join('\n')}</ul>`).join('\n');

    function buildLatestTemplate(productHtml) {
      return `<p>Hi dear! ❤️ Thanks for your interest in our campaigns! 🎉</p>
<p>I checked your profile and found some products that could be a great fit for your content. <strong>Please see the attachment when requesting products.</strong></p>
<p>Here are the latest products you can choose from 👇</p>
${productHtml}
<p><strong>🎬 TRIAL COLLABORATION</strong></p>
<p><strong>For this trial, we'd love you to create 5 videos featuring the 2 products you request.</strong></p>
<p><strong>The best part:</strong><br>✅ No draft approval or revisions<br>✅ Full creative freedom<br>✅ Free product samples<br>✅ Ads support</p>
<p>Please request 2 products from the list above, then reply with:<br><strong>Done + your TikTok username</strong></p>
<p>Looking forward to working with you! ❤️</p>`;
    }

    const templates = {
      campaign: `<p>Hi dear! ❤️ Thanks for your interest in our campaigns! 🎉</p>
<p>I checked your profile and found some products that could be a great fit for your content. <strong>Please see the attachment when requesting products.</strong></p>
<p>Here are 3 categories you can choose from 👇</p>
<p><strong>1️⃣ Personal Care</strong></p>
<p>Great for general personal care content. Includes ads support, trending products, and an average of $8–15 per sale.</p>
<p>* <strong>NEW — JIYU (Korean Skincare Brand)</strong>. 31% commission<br>https://affiliate-us.tiktok.com/api/v1/share/AJqidq7XeolK</p>
<p>* Medicube NAD+ EGF Power Duo. 20% commission<br>https://affiliate-us.tiktok.com/api/v1/share/AJZrU8uWnx8l</p>
<p>* Skin 1004. 19% commission<br>https://affiliate-us.tiktok.com/api/v1/share/AJXwVMmP13JO</p>
<p><strong>2️⃣ Makeup &amp; Cosmetics</strong></p>
<p>Best for makeup creators. Includes free ads support and guaranteed GMV opportunities.</p>
<p>* Laura Geller Foundation Kit. 22% commission<br>https://affiliate-us.tiktok.com/api/v1/share/AJV3UZBEKFGB</p>
<p>* MISSHA M Perfect Cover BB Cream. 25% commission<br>https://affiliate-us.tiktok.com/api/v1/share/AJU0jd5roqBU</p>
<p><strong>3️⃣ Skincare &amp; Personal Hygiene</strong></p>
<p>* Phofay Hair Removal Cream. 15% commission<br>https://affiliate-us.tiktok.com/api/v1/share/AJSkxJHH6wRt</p>
<p>* Centellian24. 20% commission<br>https://affiliate-us.tiktok.com/api/v1/share/AJooMytdSTQ1</p>
<p>* d'Alba Piedmont. 17% commission<br>https://affiliate-us.tiktok.com/api/v1/share/AJosZNv3bW6Z</p>
<p><strong>🎬 TRIAL COLLABORATION</strong></p>
<p><strong>For this trial, we'd love you to create 5 videos featuring the 2 products you request.</strong></p>
<p><strong>The best part:</strong><br>✅ No draft approval or revisions<br>✅ Full creative freedom<br>✅ Free product samples<br>✅ Ads support</p>
<p>Please note that completing the 5 videos is required to maintain your showcase eligibility and comply with TikTok's campaign requirements.</p>
<p><strong>📌 IMPORTANT</strong></p>
<p>1. Please request 2 products from the list above. Other products may not be guaranteed approval.</p>
<p>Not interested in these products? No worries! We have 700+ products from brands like VT Cosmetics and SKIN1004:<br>https://usee88-my.sharepoint.com/shared?id=%2Fpersonal%2Fhelmi%5Fusee%2Dmedia%5Fcom%2FDocuments%2FUSEE%20Media%20TAP%20%E2%80%93%20Creator%20Toolkit%20Brands%2Epdf</p>
<p>Here's our step-by-step collaboration guide:<br>https://usee88-my.sharepoint.com/:b:/g/personal/helmi_usee-media_com/IQCGbGZijNLSR6nBa5S3k9jMAZ1mpWROQJYoYoaNCC1IN7Y?e=cuN3gN</p>
<p><strong>PLEASE CONFIRM</strong> after requesting the samples by replying to this email with:<br><strong>"Done + your TikTok username"</strong></p>
<p>If you have trouble requesting samples, just let me know. I'll also share the guide and October rewards to help you get started.</p>
<p>Looking forward to working with you! ❤️</p>`,
      short: `<p>Hi dear! ❤️ Thanks for your interest in our campaign! 🎉</p>
<p>Please choose 2 products from the attached product list and request the samples.</p>
<p>After requesting them, reply to this email with:<br><strong>Done + your TikTok username</strong></p>
<p>Looking forward to working with you! ❤️</p>`,
      latest: buildLatestTemplate(latestProductHtml)
    };

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    }

    function renderProductEditor(groups) {
      productRows.innerHTML = groups.map((group, groupIndex) => `<div class="product-group" data-group="${groupIndex}">
        <input class="product-group-title" data-section-title value="${escapeHtml(group.title)}" aria-label="Section title">
        ${group.products.map(([name, label, commission, url], productIndex) => `<div class="product-row" data-product="${productIndex}">
          <input data-field="name" value="${escapeHtml(name)}" placeholder="Product name" aria-label="Product name">
          <input data-field="label" value="${escapeHtml(label)}" placeholder="Description / ranking" aria-label="Product description">
          <input data-field="commission" value="${escapeHtml(commission)}" placeholder="19%" aria-label="Commission">
          <input data-field="url" value="${escapeHtml(url)}" placeholder="https://..." aria-label="Product URL">
          <button type="button" data-remove-product aria-label="Remove product">×</button>
        </div>`).join('')}
      </div>`).join('');
    }

    function collectProductGroups() {
      return [...productRows.querySelectorAll('.product-group')].map(group => ({
        title: group.querySelector('[data-section-title]').value.trim(),
        products: [...group.querySelectorAll('.product-row')].map(row => [
          row.querySelector('[data-field="name"]').value.trim(),
          row.querySelector('[data-field="label"]').value.trim(),
          row.querySelector('[data-field="commission"]').value.trim(),
          row.querySelector('[data-field="url"]').value.trim()
        ]).filter(product => product.every(Boolean))
      })).filter(group => group.title && group.products.length);
    }

    let savedProducts = null;
    try { savedProducts = JSON.parse(localStorage.getItem('bulkReplyProducts') || 'null'); } catch {}
    renderProductEditor(Array.isArray(savedProducts) && savedProducts.length ? savedProducts : latestProductGroups);

    function refreshPreview() { preview.innerHTML = message.value; }
    message.addEventListener('input', refreshPreview);
    loadTemplate.addEventListener('click', () => {
      message.value = templates[template.value];
      refreshPreview();
    });
    updateProducts.addEventListener('click', () => {
      const groups = collectProductGroups();
      if (!groups.length) return status.textContent = 'Format product belum valid.';
      latestProductHtml = groups.map(group => `<p><strong>${group.title}</strong></p>
<ul>${group.products.map(([name, label, commission, url]) => `<li><strong>${name}</strong>${label ? ` — ${label}` : ''}: <a href="${url}">${url}</a> (${commission})</li>`).join('\n')}</ul>`).join('\n');
      templates.latest = buildLatestTemplate(latestProductHtml);
      localStorage.setItem('bulkReplyProducts', JSON.stringify(groups));
      if (template.value === 'latest') {
        message.value = templates.latest;
        refreshPreview();
      }
      status.textContent = 'Product list berhasil diperbarui.';
    });
    productRows.addEventListener('click', event => {
      if (event.target.matches('[data-remove-product]')) event.target.closest('.product-row').remove();
    });
    addProduct.addEventListener('click', () => {
      const group = productRows.querySelector('.product-group');
      if (!group) return;
      const row = document.createElement('div');
      row.className = 'product-row';
      row.innerHTML = '<input data-field="name" placeholder="Product name" aria-label="Product name"><input data-field="label" placeholder="Description / ranking" aria-label="Product description"><input data-field="commission" placeholder="19%" aria-label="Commission"><input data-field="url" placeholder="https://..." aria-label="Product URL"><button type="button" data-remove-product aria-label="Remove product">×</button>';
      group.appendChild(row);
    });
    document.querySelectorAll('[data-device]').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('[data-device]').forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        previewFrame.className = `preview-frame ${button.dataset.device}`;
      });
    });
    apply.addEventListener('click', async () => {
      const targets = emails.value.split(/\r?\n|,|;/).map(v => v.trim()).filter(Boolean);
      if (!targets.length) return status.textContent = 'Isi email target dulu.';
      if (!endpoint.value) return status.textContent = 'Isi endpoint Power Automate dulu.';
      if (!message.value.trim()) return status.textContent = 'Isi pesan dulu.';

      const batches = [];
      for (let i = 0; i < targets.length; i += 50) batches.push(targets.slice(i, i + 50));

      apply.disabled = true;
      status.textContent = `Menyiapkan ${batches.length} batch…`;
      try {
        for (let i = 0; i < batches.length; i++) {
          status.textContent = `Mengirim batch ${i + 1}/${batches.length} (${batches[i].length} email)…`;
          const response = await fetch(endpoint.value, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ EmailList: batches[i].join(';'), Text1: message.value })
          });
          if (!response.ok) throw new Error(`Batch ${i + 1}: HTTP ${response.status}`);
          const resultText = await response.text();
          if (resultText) {
            try {
              const result = JSON.parse(resultText);
              if (result.status && result.status !== 'completed') throw new Error(`Batch ${i + 1}: ${result.status}`);
            } catch (error) {
              if (error.message.startsWith('Batch ')) throw error;
            }
          }
          status.textContent = `Batch ${i + 1}/${batches.length} selesai (${batches[i].length} email).`;
        }
        status.textContent = `Selesai: ${targets.length} email dalam ${batches.length} batch.`;
      } catch (error) {
        status.textContent = `Gagal: ${error.message}`;
      } finally {
        apply.disabled = false;
      }
    });
  </script>
</body>
</html>
